# Every hour, copy the visit and game counts and where visitors come from
# (countries only) out of GoatCounter into stats.json, which the title page shows.
# The page reads them from its own site, so a browser that blocks GoatCounter
# still sees them. The read-only GoatCounter token
# lives in the repo secret GOATCOUNTER_TOKEN and never reaches the page.
name: Visitor locations
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  locations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch countries
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "GOATCOUNTER_TOKEN not set yet"; exit 0; }
          now="$(date -u +%Y-%m-%dT%H:00:00Z)"
          # GoatCounter now and then answers 404 for an hour: try three times, then keep
          # the last stats.json (a warning, not a failure, so no email every few hours).
          for try in 1 2 3; do
            code="$(curl -s -o raw.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
              "https://whatwouldaussiedo.goatcounter.com/api/v0/stats/locations?start=2026-10-31T00:00:00Z&end=$now&limit=6")"
            [ "$code" = 200 ] && break
            sleep 20
          done
          if [ "$code" != 200 ]; then
            echo "::warning::GoatCounter answered $code three times; keeping the last stats.json"
            head -c 300 raw.json; rm -f raw.json; exit 0
          fi
          # Counts per page and event from the API (the public counter can lag for hours);
          # the public counter only if the API does not answer.
          curl -s -o hits.json -H "Authorization: Bearer $TOKEN" \
            "https://whatwouldaussiedo.goatcounter.com/api/v0/stats/hits?start=2026-10-31T00:00:00Z&end=$now&limit=100" || true
          jq -r '.hits[]? | "\(.count)\t\(.path)"' hits.json 2>/dev/null | head -12 || true
          count() {
            local n; n="$(jq -r --arg p "$1" '[.hits[]? | select(.path == $p) | .count] | add // empty' hits.json 2>/dev/null || true)"
            [ -n "$n" ] || n="$(curl -sf "https://whatwouldaussiedo.goatcounter.com/counter/$2.json" | jq -r '.count // empty' || true)"
            echo "$n"
          }
          visits="$(count / %2F)"; started="$(count started started)"; finished="$(count finished finished)"
          rm -f hits.json
          echo "visits $visits, started $started, finished $finished"
          jq --arg v "$visits" --arg s "$started" --arg f "$finished" \
            '{visits: $v, started: $s, finished: $f, locations: [.stats[] | {code: .id, name: .name, count: .count}]}' raw.json > stats.json.new
          rm raw.json
          jq -e '.locations | type == "array"' stats.json.new > /dev/null
          mv stats.json.new stats.json
      - name: Save if changed
        run: |
          [ -f stats.json ] || exit 0
          git add stats.json
          git diff --cached --quiet && exit 0
          git -c user.name=whatwouldaussiedo -c user.email=whatwouldaussiedo@users.noreply.github.com commit -q -m "Update visitor locations"
          git push -q
